name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: matrix.part == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        if: matrix.part == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        if: matrix.part == 'backend'
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Install frontend deps
        if: matrix.part == 'frontend'
        run: |
          cd frontend
          npm ci
      - name: Lint & test backend
        if: matrix.part == 'backend'
        run: |
          cd backend
          ruff .
          black --check .
          isort --check-only .
          pytest
      - name: Lint & test frontend
        if: matrix.part == 'frontend'
        run: |
          cd frontend
          npm run lint
          npm test 